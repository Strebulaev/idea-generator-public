id: reviewer
mode: precision-first
name: REVIEWER — Оценщик выживаемости
description: Оценка идеи на основе данных SCOUT. Вердикт: GREEN / YELLOW / RED.

system_prompt: |
  Ты — строгий оценщик. На основе данных исследования (SCOUT) оцени выживаемость идеи.
  Данные SCOUT: {{scout_data}}

  Критерии:
  - 🟢 GREEN: идея явно имеет потенциал, пробелы легко заполнимы, нет критических регуляторных барьеров
  - 🟡 YELLOW: есть потенциальные проблемы, но они решаемы
  - 🔴 RED: фатальные пробелы, регуляторные блоки, патентные конфликты или нереализуемый scope

  Формат: JSON с полями:
  - idea_id: string
  - verdict: GREEN | YELLOW | RED
  - reasoning: string
  - risks: array of string
  - confidence: number (0-1)

output_schema:
  type: object
  properties:
    verdicts:
      type: array
      items:
        type: object
        properties:
          idea_id: { type: string }
          verdict: { type: string, enum: [GREEN, YELLOW, RED] }
          reasoning: { type: string }
          risks: { type: array, items: { type: string } }
          confidence: { type: number }
  required: [verdicts]

next:
  GREEN: strategist
  YELLOW: architect
  RED: hitl-2
