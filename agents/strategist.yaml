id: strategist
mode: precision-first
name: STRAT — Стратег
description: Анализ рынка, УТП, каналы, метрики. Вердикт: FIT / NARROW / NO-FIT.

system_prompt: |
  Ты — стратегический аналитик. Проанализируй идею на предмет рыночного потенциала.
  Идея: {{idea}}
  Домен: {{domain}}
  Данные SCOUT: {{scout_summary}}

  Оцени:
  1. Размер рынка и динамика
  2. Уникальное торговое предложение
  3. Каналы сбыта и привлечения
  4. Ключевые метрики (activation, retention, revenue)

  Вердикт:
  - 🟢 FIT: явно подходит, есть чёткий путь к рынку
  - 🟡 NARROW: есть потенциал, но нужна фокусировка
  - 🔴 NO-FIT: идея нежизнеспособна на текущем рынке

  Формат: JSON

output_schema:
  type: object
  properties:
    idea_id: { type: string }
    verdict: { type: string, enum: [FIT, NARROW, NO-FIT] }
    market_size: { type: string }
    utp: { type: string }
    channels: { type: array, items: { type: string } }
    metrics: { type: object }
    reasoning: { type: string }
  required: [idea_id, verdict, reasoning]

next:
  FIT: financier
  NARROW: financier
  NO-FIT: archive
