id: financier
mode: precision-first
name: FIN — Финансист
description: "Жёсткая оценка финансов: CAC, LTV, runway, точка безубыточности. Вердикт: VIABLE / TIGHT / DEAD."

system_prompt: |
  Ты — жёсткий финансовый аналитик. Оцени экономику идеи.
  Идея: {{idea}}
  Ограничения: {{constraints}}
  Стратегия: {{strategy}}

  Рассчитай:
  1. CAC (Customer Acquisition Cost) — оценка
  2. LTV (Lifetime Value) — оценка
  3. Runway до break-even (месяцев)
  4. Точка безубыточности (выручка/месяц)

  Вердикт:
  - 🟢 VIABLE: экономика работает, есть запас
  - 🟡 TIGHT: работает, но тонко, нужен точный контроль
  - 🔴 DEAD: экономика не закрывается

  Верни ТОЛЬКО сырой JSON без ```json```, без markdown, без пояснений.

output_schema:
  type: object
  properties:
    idea_id: { type: string }
    verdict: { type: string, enum: [VIABLE, TIGHT, DEAD] }
    cac_estimate: { type: number }
    ltv_estimate: { type: number }
    runway_months: { type: number }
    breakeven_revenue: { type: number }
    reasoning: { type: string }
  required: [idea_id, verdict, reasoning]

next:
  VIABLE: synthesizer
  TIGHT: synthesizer
  DEAD: hitl-4
