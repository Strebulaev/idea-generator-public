name: Idea Generator Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Тема идеи"
        required: true
        type: string
      domain:
        description: "Домен / индустрия"
        required: true
        type: string
      constraints:
        description: "Ограничения (бюджет, юрисдикция, сроки)"
        required: false
        type: string
        default: ""
      continue_run_id:
        description: "RUN_ID для продолжения после HITL"
        required: false
        type: string
        default: ""
      hitl_decision:
        description: "Решение HITL: confirm / dispute"
        required: false
        type: string
        default: ""
      hitl_id:
        description: "ID HITL-этапа для продолжения (hitl-1, hitl-2, hitl-3)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      KILO_GATEWAY_URL: ${{ secrets.KILO_GATEWAY_URL }}
      KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
      IDEA_GENERATOR_MODEL: ${{ secrets.IDEA_GENERATOR_MODEL || 'stepfun/step-3.7-flash:free' }}
      GITHUB_MODEL: ${{ secrets.IDEA_GENERATOR_MODEL || 'stepfun/step-3.7-flash:free' }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      TOPIC: ${{ inputs.topic }}
      DOMAIN: ${{ inputs.domain }}
      CONSTRAINTS: ${{ inputs.constraints }}
      CONTINUE_RUN_ID: ${{ inputs.continue_run_id || '' }}
      RUN_ID: ${{ inputs.continue_run_id || format('{0}-{1}', github.run_id, github.run_attempt) }}
      HITL_DECISION: ${{ inputs.hitl_decision || '' }}
      HITL_ID: ${{ inputs.hitl_id || '' }}
      HITL1_TIMEOUT_SECONDS: ${{ vars.HITL1_TIMEOUT_SECONDS || '3600' }}
      HITL2_TIMEOUT_SECONDS: ${{ vars.HITL2_TIMEOUT_SECONDS || '3600' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      PRIVATE_REPOSITORY: Strebulaev/idea-generator-private

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: Strebulaev/idea-generator-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml python-dotenv qdrant-client

      - name: Run pipeline
        id: pipeline
        run: python private/orchestrator/runner.py
        env:
          STEP_NAME: full

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea-generator-${{ env.RUN_ID }}
          path: artifacts/${{ env.RUN_ID }}/
          retention-days: 30
          if-no-files-found: warn
