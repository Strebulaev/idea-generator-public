name: Idea Generator Pipeline Steps

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Тема идеи"
        required: true
        type: string
      domain:
        description: "Домен / индустрия"
        required: true
        type: string
      constraints:
        description: "Ограничения (бюджет, юрисдикция, сроки)"
        required: false
        type: string
        default: ""
      continue_run_id:
        description: "RUN_ID для продолжения после HITL"
        required: false
        type: string
        default: ""
      hitl_decision:
        description: "Решение HITL: confirm / dispute"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      KILO_GATEWAY_URL: ${{ secrets.KILO_GATEWAY_URL }}
      KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
      IDEA_GENERATOR_MODEL: ${{ secrets.IDEA_GENERATOR_MODEL || 'stepfun/step-3.7-flash:free' }}
      GITHUB_MODEL: ${{ secrets.IDEA_GENERATOR_MODEL || 'stepfun/step-3.7-flash:free' }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      TOPIC: ${{ inputs.topic }}
      DOMAIN: ${{ inputs.domain }}
      CONSTRAINTS: ${{ inputs.constraints }}
      RUN_ID: ${{ inputs.continue_run_id || format('{0}-{1}', github.run_id, github.run_attempt) }}
      HITL_DECISION: ${{ inputs.hitl_decision }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml python-dotenv qdrant-client

      - name: Check Qdrant connectivity
        run: python orchestrator/runner.py
        env:
          STEP_NAME: qdrant-healthcheck

      - name: BS — Brainstormer
        id: brainstormer
        run: python orchestrator/runner.py
        env:
          STEP_NAME: brainstormer

      - name: SCOUT — Исследователь
        id: scout
        run: python orchestrator/runner.py
        env:
          STEP_NAME: scout

      - name: REVIEWER — Оценщик
        id: reviewer
        run: python orchestrator/runner.py
        env:
          STEP_NAME: reviewer

      - name: ARCH — Архитектор
        id: architect
        if: ${{ !(steps.reviewer.outputs.status == 'awaiting-hitl-2' || steps.reviewer.outputs.status == 'archived') }}
        run: python orchestrator/runner.py
        env:
          STEP_NAME: architect

      - name: STRAT — Стратег
        id: strategist
        if: ${{ !(steps.architect.outputs.status == 'awaiting-hitl-2' || steps.architect.outputs.status == 'archived') }}
        run: python orchestrator/runner.py
        env:
          STEP_NAME: strategist

      - name: FIN — Финансист
        id: financier
        if: ${{ !(steps.strategist.outputs.status == 'awaiting-hitl-2' || steps.strategist.outputs.status == 'archived') }}
        run: python orchestrator/runner.py
        env:
          STEP_NAME: financier

      - name: SYNTH — Синтезатор
        id: synthesizer
        if: ${{ !(steps.financier.outputs.status == 'awaiting-hitl-2' || steps.financier.outputs.status == 'archived' || steps.financier.outputs.status == 'awaiting-hitl-4') }}
        run: python orchestrator/runner.py
        env:
          STEP_NAME: synthesizer

      - name: HITL-5 — Финальный go/no-go
        id: hitl-5
        if: ${{ !(steps.synthesizer.outputs.status == 'awaiting-hitl-2' || steps.synthesizer.outputs.status == 'archived' || steps.synthesizer.outputs.status == 'awaiting-hitl-4') }}
        run: python orchestrator/runner.py
        env:
          STEP_NAME: hitl-5

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea-generator-${{ env.RUN_ID }}
          path: artifacts/${{ env.RUN_ID }}/
          retention-days: 30
          if-no-files-found: warn
