name: Kilo Autonomous Agent

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Тема идеи"
        required: true
        type: string
      domain:
        description: "Домен / индустрия"
        required: true
        type: string
      constraints:
        description: "Ограничения (бюджет, юрисдикция, сроки)"
        required: false
        type: string
        default: ""
      continue_run_id:
        description: "RUN_ID для продолжения после HITL"
        required: false
        type: string
        default: ""
      hitl_decision:
        description: "Решение HITL: confirm / dispute"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
      IDEA_GENERATOR_MODEL: ${{ secrets.IDEA_GENERATOR_MODEL || 'stepfun/step-3.7-flash:free' }}
      TOPIC: ${{ inputs.topic }}
      DOMAIN: ${{ inputs.domain }}
      CONSTRAINTS: ${{ inputs.constraints }}
      RUN_ID: ${{ inputs.continue_run_id || format('{0}-{1}', github.run_id, github.run_attempt) }}
      HITL_DECISION: ${{ inputs.hitl_decision }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kilo CLI
        run: |
          curl -fsSL https://kilo.ai | sh

      - name: Prepare prompt
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          base = Path(".")
          src = base / "agents" / "master-prompt.md"
          text = src.read_text(encoding="utf-8")
          text = text.replace("{{topic}}", os.environ.get("TOPIC", ""))
          text = text.replace("{{domain}}", os.environ.get("DOMAIN", ""))
          text = text.replace("{{constraints}}", os.environ.get("CONSTRAINTS", ""))
          out = base / "artifacts" / os.environ.get("RUN_ID", "run") / "prompt.md"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text, encoding="utf-8")
          print(out)
          PY

      - name: Run Kilo agent
        run: |
          MODEL="${{ secrets.IDEA_GENERATOR_MODEL || 'stepfun/step-3.7-flash:free' }}"
          PROMPT_FILE="artifacts/${{ env.RUN_ID }}/prompt.md"
          kilo run "$(cat "$PROMPT_FILE")" --auto --model "$MODEL"

      - name: List artifacts
        if: always()
        run: |
          echo "RUN_ID=${{ env.RUN_ID }}"
          ls -la artifacts || true
          ls -la artifacts/${{ env.RUN_ID }} || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea-generator-${{ env.RUN_ID }}
          path: artifacts/${{ env.RUN_ID }}/
          retention-days: 30
          fail-on-empty: false
