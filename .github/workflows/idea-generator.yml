name: Idea Generator

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Тема идеи"
        required: true
        type: string
      domain:
        description: "Домен / индустрия"
        required: true
        type: string
      constraints:
        description: "Ограничения (бюджет, юрисдикция, сроки)"
        required: false
        type: string
        default: ""
      continue_run_id:
        description: "RUN_ID для продолжения после HITL"
        required: false
        type: string
        default: ""
      hitl_decision:
        description: "Решение HITL: confirm / dispute"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      KILO_GATEWAY_URL: ${{ secrets.KILO_GATEWAY_URL }}
      KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
      GITHUB_MODEL: ${{ secrets.IDEA_GENERATOR_MODEL || 'gpt-4o' }}
      TOPIC: ${{ inputs.topic }}
      DOMAIN: ${{ inputs.domain }}
      CONSTRAINTS: ${{ inputs.constraints }}
      RUN_ID: ${{ inputs.continue_run_id || format('{0}-{1}', github.run_id, github.run_attempt) }}
      HITL_DECISION: ${{ inputs.hitl_decision }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml python-dotenv

      - name: Run idea generator pipeline
        run: python orchestrator/runner.py
        env:
          KILO_GATEWAY_URL: ${{ secrets.KILO_GATEWAY_URL }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          IDEA_GENERATOR_MODEL: ${{ secrets.IDEA_GENERATOR_MODEL || 'gpt-4o' }}
          TOPIC: ${{ inputs.topic }}
          DOMAIN: ${{ inputs.domain }}
          CONSTRAINTS: ${{ inputs.constraints }}
          RUN_ID: ${{ inputs.continue_run_id || format('{0}-{1}', github.run_id, github.run_attempt) }}
          HITL_DECISION: ${{ inputs.hitl_decision }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List artifacts directory
        if: always()
        run: |
          echo "RUN_ID=${{ env.RUN_ID }}"
          ls -la artifacts || true
          ls -la artifacts/${{ env.RUN_ID }} || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea-generator-${{ env.RUN_ID }}
          path: artifacts/${{ env.RUN_ID }}/
          retention-days: 30
          if-no-files-found: warn

      - name: Create summary
        if: always()
        run: |
          ARTIFACT="artifacts/${{ env.RUN_ID }}/final.json"
          if [ -f "$ARTIFACT" ]; then
            python orchestrator/summary.py "$ARTIFACT" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::final.json not found at $ARTIFACT"
            echo "## 🚀 Idea Generator Run" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** failed or stopped before final.json" >> $GITHUB_STEP_SUMMARY
            echo "- **RUN_ID:** ${{ env.RUN_ID }}" >> $GITHUB_STEP_SUMMARY
          fi
